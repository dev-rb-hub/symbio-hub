version: 2
updates:
  # 1. React Frontend packages.
  # Version-update PRs are deferred until roadmap delivery work starts; set the
  # limit back to 5 to resume. Security updates are not affected by this limit.
  - package-ecosystem: "npm"
    directory: "/frontend/Symbio.Frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"

  # 2. .NET backend NuGet packages (version updates deferred, see above).
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "backend"

  # 3. Scan GitHub Actions Workflow Versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "ci-cd"
