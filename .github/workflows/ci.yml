name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/Symbio.API.Tests/Symbio.API.Tests.csproj

      - name: Build backend
        run: dotnet build backend/Symbio.API/Symbio.API.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend/Symbio.API.Tests/Symbio.API.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/Symbio.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/Symbio.Frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend/Symbio.Frontend
        run: npm run build

